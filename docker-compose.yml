services:
  mysql:
    image: mysql:8.4
    container_name: useruah_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: useruah
      MYSQL_USER: useruah
      MYSQL_PASSWORD: useruah_local_dev
      MYSQL_ROOT_PASSWORD: root_local_dev
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -proot_local_dev --silent']
      interval: 10s
      timeout: 5s
      retries: 15

  adminer:
    image: adminer:4
    container_name: useruah_adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '8080:8080'

volumes:
  mysql_data:
